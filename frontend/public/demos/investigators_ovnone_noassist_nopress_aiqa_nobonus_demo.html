<!doctype html>
<!--
  Investigators — playable mock with configurable study features.
  Single-file, offline, no network access: all teammate/assistant behavior is canned
  simulation mirroring the deployed participant flow as of build 9226e2a4 (2026-10-09).

  Provenance note: this file used to hold the S2 behavioral reference that contracts
  and artifacts cite by line number. That frozen reference now lives at
  docs/baseline/reference/investigators_time_pressure_demo.html (SHA-256 7ced90c5…9825).
  THIS file is a shareable demo only — do not cite its lines as reference truth.

  Flow: consent -> case background + initials -> workspace tour -> practice (share +
  assistant previews) -> comprehension -> [aiqa: optional AI rules Q&A] ->
  connecting -> 300 s task (file/chat/assistant + check-in at
  60 s, scripted requests at 45/130/210 s, pressure remarks at 75/83 s, warning at
  240 s) -> time-up -> confidence -> questionnaire -> suspicion (own page) ->
  debrief -> data-use -> completion code.
-->

/* ----- task workbench ------------------------------------------------------------ */

.task-screen {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.task-header {
  padding: 10px 14px;
  background: #222;
  color: #fff;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  font-size: 15px;
  flex: none;
}
.task-header .goal {
  color: #ccc;
}
.mine-strip {
  background: rgba(255, 255, 255, 0.12);
  padding: 2px 9px;
  border-radius: 3px;
}
.status-strip {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-size: 19px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 4px;
}
.timer.low-time {
  background: #8a1f1f;
  color: #fff;
}
.conn {
  font-size: 13px;
  color: #ffd9a8;
}
.paused-note,
.locked-note {
  font-size: 13px;
  color: #ffd9a8;
}
.notice-bar {
  background: #fff4d6;
  border-bottom: 1px solid #e0c97f;
  padding: 8px 14px;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
}
.notice-bar button {
  font-size: 13px;
  padding: 4px 10px;
}

.task-grid {
  flex: 1;
  display: grid;
  --sx: 0.45;
  --sy: 0.55;
  /* BA-76: the two tracks share the content box *minus* the 10px gap — sizing both
     to 100% overruns the grid by the gap width and puts the split 5px off the
     handles below. */
  grid-template-columns: minmax(0, calc(var(--sx) * (100% - 10px))) minmax(0, calc((1 - var(--sx)) * (100% - 10px)));
  grid-template-rows: minmax(0, calc(var(--sy) * (100% - 10px))) minmax(0, calc((1 - var(--sy)) * (100% - 10px)));
  gap: 10px;
  padding: 10px;
  min-height: 0;
  position: relative;
}
/* Pane splitters: drag or arrow-key the boundaries between the case-file column and
   the right column (vertical bar), and between team chat / assistant (horizontal). */
.grid-resizer {
  position: absolute;
  z-index: 3;
  background: transparent;
  touch-action: none;
  border-radius: 4px;
}
.grid-resizer:hover,
.grid-resizer:focus-visible {
  background: rgba(39, 74, 113, 0.18);
  outline: none;
}
/* Handles cover the 10px inter-track gaps exactly: padding + split share of
   (border-box width − padding − gap). Same (100% - 30px) span the pointer math
   in Workbench.startDrag uses. */
.grid-resizer-x {
  top: 10px;
  bottom: 10px;
  width: 10px;
  left: calc(10px + var(--sx) * (100% - 30px));
  cursor: col-resize;
}
.grid-resizer-y {
  left: calc(10px + var(--sx) * (100% - 30px) + 10px);
  right: 10px;
  height: 10px;
  top: calc(10px + var(--sy) * (100% - 30px));
  cursor: row-resize;
}
/* Piloted layout (UX feedback): case file spans the left column; team chat sits
 * upper-right, AI assistant lower-right. Each pane is colour-coded so the three
 * surfaces are distinguishable at a glance. */
.pane[data-pane="case-file"] {
  grid-column: 1;
  grid-row: 1 / 3;
}
.pane[data-pane="team-chat"] {
  grid-column: 2;
  grid-row: 1;
  border-color: #c8d6ec;
}
.pane[data-pane="assistant"] {
  grid-column: 2;
  grid-row: 2;
  border-color: #d9cfec;
}
.pane[data-pane="team-chat"] .pane-head {
  background: #e6eef9;
  color: #274a71;
  border-bottom-color: #c8d6ec;
}
.pane[data-pane="assistant"] .pane-head {
  background: #f0ebf8;
  color: #543f79;
  border-bottom-color: #d9cfec;
}
/* ai=false variants: no assistant pane — team chat spans both right rows. */
.task-grid.no-assistant .pane[data-pane="team-chat"] {
  grid-row: 1 / 3;
}
.pane {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

  align-items: center;

  padding: 8px 12px;
  border-bottom: 1px solid #eee;
  flex: none;
}
.pane-head h2 {
  font-size: 15px;
  margin: 0;
}
.pane-head .count {
  font-size: 12px;
  color: #666;
}
.pane-hint {
  font-size: 12.5px;
  color: #777;
  margin: 6px 12px;
  flex: none;
}

/* ----- case file ------------------------------------------------------------------ */

.files-list {
  list-style: none;
  margin: 0;
  padding: 8px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.file {
  border: 1px solid #d8d8d8;
  border-radius: 6px;
  padding: 8px 10px;
  background: #fff;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.file[draggable="true"] {
  cursor: grab;
}
.file.dragging {
  opacity: 0.5;
}
.drag-grip {
  flex: none;
  color: #999;
  font-size: 13px;
  line-height: 1.2;
  padding: 2px 2px 0;
  cursor: grab;
  user-select: none;
  background: none;
  border: none;
  font-family: inherit;
}
.drag-grip:focus-visible {
  outline: 2px solid #5b8dd9;
  outline-offset: 1px;
  border-radius: 3px;
}
.drag-grip:disabled {
  cursor: default;
  opacity: 0.5;
}
.drag-grip.grabbed {
  color: #1a1a1a;
  background: #e3eeff;
  border-radius: 3px;
  outline: 1px dashed #5b8dd9;
  cursor: grabbing;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.file-main {
  flex: 1;
  min-width: 0;
}
.file-head {
  display: flex;
  gap: 8px;
  align-items: baseline;
  flex-wrap: wrap;
}
.file-stamp {
  font-size: 12px;
  color: #666;
}
.file-crate {
  font-size: 12px;
  font-weight: 700;
  color: #333;
}
.qa-label {
  display: block;
  font-weight: 600;
  margin: 14px 0 4px;
}
.qa-input {
  width: 100%;
  font: inherit;
  padding: 8px;
  border: 1px solid #bbb;
  border-radius: 6px;
  resize: vertical;
}
.qa-exchange {
  margin: 10px 0;
}
.qa-question {
  font-weight: 600;
  margin: 0 0 4px;
}
.qa-answer {
  background: #f3f6fa;
  border: 1px solid #dde5ee;
  border-radius: 6px;
  padding: 8px 10px;
  margin: 0;
}
.qa-answer.pending {
  color: #777;
  font-style: italic;
}
.qa-actions {
  margin: 8px 0;
}
.qa-button {
  min-width: 120px;
  min-height: 42px;
}
.comprehension-list {
  list-style: none;
  padding: 0;
}
.comprehension-list fieldset {
  border: 1px solid #ccc;
  border-radius: 6px;
  margin: 0 0 10px;
  padding: 8px 12px;
}
.comprehension-list label {
  margin-right: 18px;
}
.comprehension-list .missed fieldset {
  border-color: #9a2c2c;
  background: #fdf0f0;
}
.file-source {
  font-size: 11px;
  color: #666;
}
/* UX round 3, item 8: teammate-added intel vs the participant's own file. */
.file.from-team {
  border-color: #8fb3d9;
  border-left: 4px solid #3f74b0;
  background: #f2f7fd;
}
.file.from-team .file-source {
  font-weight: 700;
  color: #2b5a8f;
  background: #dde9f7;
  border-radius: 4px;

}
.file-body {
  font-size: 14px;
  line-height: 1.45;
  margin-top: 2px;
}
.file-actions {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: none;
}
.file-actions .icon-btn {
  padding: 2px 8px;
  font-size: 13px;
}
.file-actions button {
  font-size: 12.5px;
  padding: 4px 10px;
}
.shared-tag {
  font-size: 11.5px;
  color: #1a6b2f;

  padding: 3px 8px;

}

/* ----- chat / assistant --------------------------------------------------------------- */

.msgs {
  list-style: none;
  margin: 0;
  padding: 8px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;

}
.msg {

}
.msg.mine {

}
.msg .who {
  display: block;
  font-size: 11.5px;
  font-weight: 700;
  color: #555;
  margin-bottom: 2px;
}
.msg-body {
  white-space: pre-wrap;
}
.filepill {
  display: block;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 13px;
  background: #fafafa;
}
/* UX round 4, item 9: shared intel is its own card in the message list, not
   embedded in the message bubble — teammate and participant shares alike. */
.intel-card {
  max-width: 92%;
}
.intel-card.mine {
  align-self: flex-end;
}
.filepill .fs {
  display: block;
  font-size: 11px;

}
.pill-btn {

.pressure-strip {

  border-bottom: 1px solid #e2e8e5;
  flex: none;
}
.greeting-row {
  display: flex;
  gap: 8px;
  padding: 6px 12px;
  flex: none;
}
.team-actions {
  display: flex;
  gap: 8px;
  padding: 8px 12px 0;
  flex: none;
}
.team-actions select {
  flex: 1;
  font-size: 14px;
  padding: 5px;
}
.composer {
  display: flex;
  gap: 8px;
  padding: 8px 12px 10px;
  flex: none;
}
.composer input {
  flex: 1;
  font-size: 14px;
  padding: 7px 9px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

/* UX round 3, item 9: the assistant is generating a response. */
.msg.thinking {
  color: #666;
  font-style: italic;
}
.thinking-dots span {
  display: inline-block;
  animation: thinking-blink 1.2s infinite both;
}
.thinking-dots span:nth-child(2) {
  animation-delay: 0.2s;
}
.thinking-dots span:nth-child(3) {
  animation-delay: 0.4s;
}
@keyframes thinking-blink {
  0%,
  80%,
  100% {
    opacity: 0.2;
  }
  40% {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .thinking-dots span {
    animation: none;
  }
}

/* ----- submit bar / crate pickers ----------------------------------------------------- */

.submit-bar {
  flex: none;
  /* UX round 3, item 10: visibly a separate answer area, not part of the panes. */

  border-top: 3px solid #2f6b5e;
  box-shadow: 0 -3px 8px rgba(0, 0, 0, 0.08);
  padding: 8px 14px 10px;
  /* AB-20: head + pickers share one row so the bar costs the grid ~60 px, not ~130. */
  display: flex;
  align-items: center;
  gap: 18px;
}
.submit-head {

}
.submit-bar .submit-title {

.crate-picker {

  border: 1px solid #bbb;

}
.save-status {
  font-size: 12px;
  min-height: 1.2em;
  color: #666;
}
.save-saving {
  color: #8a6d1a;
}
.save-saved {
  color: #2f6b5e;
}
.save-rejected,
.save-dirty[data-status] {

}
.crate-picker[data-status="rejected"] select {

.task-center {
  display: inline-flex;
  align-items: center;
  justify-content: center;

}
.task-progress {

.reveal-row {
  display: flex;
  gap: 14px;
  margin: 12px 0;
}
.reveal-chip {
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 16px;
}
/* ----- small screens ------------------------------------------------------------------- */

/* AB-20: the one-row footer only fits comfortably on wide viewports — stack it
   again once four pickers plus the head stop fitting side by side. */
@media (max-width: 1100px) {
  .submit-bar {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .submit-head {
    max-width: none;
  }
}

@media (max-width: 900px) {
  .task-grid {
    grid-template-columns: 1fr;
    grid-template-rows: none;
    overflow-y: auto;
  }
  .grid-resizer {
    display: none;
  }
  .pane[data-pane="case-file"],
  .pane[data-pane="team-chat"],
  .pane[data-pane="assistant"] {
    grid-column: auto;
    grid-row: auto;
    min-height: 32vh;
  }
  .task-screen {
    height: auto;
    overflow: visible;
  }
  /* Match the fielded build: on scrolling narrow viewports the header stays
     pinned (below the fixed mock bar) so the timer can't be scrolled away. */
  .task-header {
    position: sticky;
    top: 52px;
    z-index: 30;
  }
  .submit-row {
    grid-template-columns: repeat(2, 1fr);
  }
  .confidence-grid {
    grid-template-columns: 1fr;
  }
}

/* ----- WP09: bound materials, exposure surfaces, practice, withdrawal -------------------- */

.callout {
  background: #f6f8f7;
  border: 1px solid #d7e0dc;
  border-left: 4px solid #2f6b5e;
  border-radius: 6px;
  padding: 10px 12px;
}
.exposure-strip {
  padding: 6px 14px;
  background: #f6f8f7;
  border-bottom: 1px solid #d7e0dc;
  font-size: 14px;
  color: #333;
}
/* ----- practice (mirrors the task workbench) ------------------------------------------------ */

.practice-note {
  font-size: 13px;
  color: #666;
}
.practice-note .done-tag {
  margin-left: 0;
}
.done-tag {
  font-size: 12px;
  font-weight: 700;
  color: #2f6b5e;
  margin-left: 8px;
}

/* ----- consent -------------------------------------------------------------------------------- */

.panel.consent-panel {
  max-width: 780px;
}
.consent-panel h1 {
  font-size: 25px;
  line-height: 1.25;
  margin-bottom: 4px;
}
.consent-sub {
  font-size: 15px;
  color: #666;
  margin: 0 0 18px;
}
.consent-copy {
  max-height: 52vh;
  overflow-y: auto;
  padding-right: 12px;
  margin: 0 0 16px;
}
.consent-copy p {
  font-size: 16px;
}
.consent-question {
  font-size: 17px;
  font-weight: 700;
  padding-top: 16px;
  border-top: 1px solid #ddd;
}

/* ----- confidence ratings (per-answered-crate grid, mirrors the answer bar) ------------------- */

.confidence-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
  margin: 14px 0 18px;
}
.confidence-card {
  border: 1px solid #d6dfec;
  border-radius: 6px;
  padding: 13px;
  background: #f8fbff;
}
.confidence-card .card-title {
  font-size: 14px;
  font-weight: 700;
  margin: 0 0 4px;
}
.confidence-card .card-answer {
  font-size: 13px;
  color: #444;
  margin: 0 0 6px;
}
.confidence-card .no-ans { color: #999; }
.confidence-card input[type="range"] {
  width: 100%;
  margin: 8px 0 4px;
}
.slider-readout {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  margin: 4px 0;
  color: #2f6b5e;
  min-height: 1.2em;
}
.slider-hint {
  color: #666;
  font-size: 13px;
  margin: 2px 0 0;
}
.done-line {
  color: #666;
  font-size: 14px;
}
.item {
  border-top: 1px solid #eee;
  padding-top: 12px;
  margin-top: 12px;
}
.item.skipped,
.confidence-card.skipped {
  opacity: 0.65;
}
.skip-row {
  margin-top: 6px;
  font-size: 13px;
}
.skip-mark {
  color: #666;
  font-style: italic;
}
