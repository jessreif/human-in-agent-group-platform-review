# Not yet executed in CI. The recorded unit run (docs/EVALUATIONS.md) did not use uv.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend unit tests
        working-directory: backend
        run: |
          pip install uv
          uv sync --frozen --group dev
          uv run pytest -m "not integration" -q
      - name: Demo build
        run: |
          python3 scripts/build_demo_mocks.py
          python3 scripts/build_demo_mocks.py --check
      - name: Demo fidelity notes
        run: python3 scripts/check_demo_fidelity.py
      - name: Fingerprints
        run: python3 scripts/verify_fingerprints.py
